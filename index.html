<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archives de Capsules — France & Belgique</title>
<style>
  :root{
    --malt:#2b1d12;
    --parchment:#efe4cf;
    --copper:#b8722f;
    --copper-dark:#8f5620;
    --hop:#5c7a44;
    --card:#fbf6ea;
    --line:#d8c9a8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Georgia', 'Iowan Old Style', serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(184,114,47,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(92,122,68,0.08), transparent 40%),
      var(--parchment);
    color:var(--malt);
    margin:0;
    padding:24px 16px 60px;
  }
  header{ text-align:center; margin-bottom:28px; }
  h1{
    font-size:2.2em;
    letter-spacing:0.5px;
    margin:0 0 4px;
    color:var(--malt);
  }
  h1 .cap-icon{
    display:inline-block;
    width:0.8em; height:0.8em;
    border-radius:50%;
    background:
      repeating-conic-gradient(var(--copper) 0deg 15deg, var(--copper-dark) 15deg 30deg);
    vertical-align:middle;
    margin-right:8px;
    border:2px solid var(--malt);
  }
  .subtitle{
    color:#6b5c46;
    font-style:italic;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.95em;
  }
  .stats{
    text-align:center;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.85em;
    color:var(--copper-dark);
    margin-bottom:6px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .hint{
    text-align:center;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.8em;
    color:#8a7a5f;
    margin-bottom:22px;
  }
  .controls{
    max-width:900px;
    margin:0 auto 34px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    font-family:'Trebuchet MS', sans-serif;
  }
  input[type="text"], select{
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:15px;
    background:var(--card);
    color:var(--malt);
  }
  input[type="text"]{ width:280px; }
  input[type="text"]:focus, select:focus{
    outline:2px solid var(--copper);
    outline-offset:1px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:20px;
    max-width:1280px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    padding:18px 16px 20px;
    border-radius:6px;
    border:1px solid var(--line);
    box-shadow:0 3px 8px rgba(43,29,18,0.08);
    text-align:center;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 16px rgba(43,29,18,0.15);
  }
  /* Capsule = bottle cap with crimped edge illusion */
  .cap-circle{
    width:100px; height:100px;
    margin:0 auto 10px;
    border-radius:50%;
    position:relative;
    background:
      repeating-conic-gradient(
        var(--cap-a, #d9cdb4) 0deg 9deg,
        var(--cap-b, #c3b494) 9deg 18deg
      );
    box-shadow:
      inset 0 0 0 8px var(--card),
      inset 0 0 0 9px var(--line),
      0 2px 4px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
  }
  .cap-circle:hover{ box-shadow:
      inset 0 0 0 8px var(--card),
      inset 0 0 0 9px var(--copper),
      0 2px 4px rgba(0,0,0,0.15);
  }
  .cap-circle img{
    width:84px; height:84px;
    border-radius:50%;
    object-fit:cover;
  }
  .cap-inner{
    width:64px; height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.62em;
    line-height:1.2;
    color:#7a6c52;
    font-family:'Trebuchet MS', sans-serif;
    text-align:center;
    padding:4px;
  }
  .brand{ font-weight:bold; font-size:1.22em; color:var(--malt); }
  .variant{ font-size:0.88em; color:var(--copper-dark); font-weight:bold; margin:4px 0 8px; }
  .details{ font-size:0.85em; color:#6b5c46; margin-bottom:3px; font-family:'Trebuchet MS', sans-serif;}
  .badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:12px;
    font-size:0.75em;
    margin-top:10px;
    background:#e3d9c3;
    color:#5c4a30;
    font-family:'Trebuchet MS', sans-serif;
  }
  .rare{ background:#f0c239; color:#5c3d00; font-weight:bold; }
  .vintage{ background:var(--hop); color:white; }
  .remove-photo{
    display:block;
    margin:8px auto 0;
    background:none;
    border:none;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.72em;
    color:#a35c3a;
    text-decoration:underline;
    cursor:pointer;
    padding:2px;
  }
  .empty{
    text-align:center;
    color:#8a7a5f;
    font-family:'Trebuchet MS', sans-serif;
    margin-top:40px;
  }
</style>
</head>

<header>
  <h1><span class="cap-icon"></span>Archives de Capsules</h1>
  <div class="subtitle">Catalogue France &amp; Belgique</div>
</header>

<div class="stats" id="statsLine"></div>
<div class="hint">📷 Clique sur une capsule pour ajouter ou remplacer sa photo (prise directement avec l'appareil photo sur mobile)</div>

    <option value="all">Tous les pays</option>

    <option value="Belgique">Belgique</option>
  </select>
  <select id="statusFilter">
    <option value="all">Tous statuts</option>
    <option value="standard">Standard</option>
    <option value="rare">⭐ Rare</option>
    <option value="vintage">🕰️ Vintage</option>
  </select>
  <select id="sortFilter">
    <option value="az">Trier : De A à Z</option>
    <option value="za">Trier : De Z à A</option>
    <option value="pays">Trier : Par pays</option>
  </select>
</div>

<div class="grid" id="capsuleGrid"></div>
<div class="empty" id="emptyMsg" style="display:none;">Aucune capsule ne correspond à ta recherche.</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

const grid = document.getElementById('capsuleGrid');
const emptyMsg = document.getElementById('emptyMsg');
const statsLine = document.getElementById('statsLine');
const searchInput = document.getElementById('searchInput');
const countryFilter = document.getElementById('countryFilter');
const statusFilter = document.getElementById('statusFilter');
const sortFilter = document.getElementById('sortFilter');
const photoInput = document.getElementById('photoInput');

let currentEditKey = null;

// Palette de teintes pour varier l'aspect des capsules selon la marque
const paletteSet = [
  ['#d9cdb4','#c3b494','#e8dcc4'],
  ['#d8b7a0','#c29a7e','#ecd9c8'],
  ['#c9d6b8','#a9bc8f','#e2ecd6'],
  ['#d0c2e0','#b39fcb','#e9e0f2'],
  ['#e0c78f','#c9a856','#f2e4bd'],
  ['#c3b8a8','#a99c86','#e6ded2']
];
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function capsuleKey(cap){
  return 'capsulePhoto::' + cap.marque + '::' + cap.variante;
}
function getPhoto(cap){
  try{ return localStorage.getItem(capsuleKey(cap)); }
  catch(e){ return null; }
}
function savePhoto(key, dataUrl){
  try{ localStorage.setItem(key, dataUrl); }
  catch(e){ alert("Impossible d'enregistrer la photo : mémoire du navigateur pleine."); }
}
function removePhoto(key){
  try{ localStorage.removeItem(key); }catch(e){}
}
function resizeImage(file, maxSize, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
      else{ if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderCapsules(data){
  grid.innerHTML = '';
  emptyMsg.style.display = data.length ? 'none' : 'block';
  data.forEach(cap => {
    const card = document.createElement('div');
    card.className = 'card';

    let badgeHtml = '';
    if(cap.statut === 'rare') badgeHtml = '<span class="badge rare">⭐ Rare</span>';
    if(cap.statut === 'vintage') badgeHtml = '<span class="badge vintage">🕰️ Vintage</span>';

    const [a,b,mid] = paletteSet[hashStr(cap.marque) % paletteSet.length];
    const key = capsuleKey(cap);
    const photo = getPhoto(cap);

    const circleContent = photo
      ? `<img src="${photo}" alt="Photo de la capsule ${cap.marque}">`
      : `<div class="cap-inner" style="background:${mid};">📷<br>Photo à venir</div>`;

    card.innerHTML = `
      <div class="cap-circle" data-key="${key}" style="--cap-a:${a}; --cap-b:${b};" title="Cliquer pour ajouter/changer la photo">
        ${circleContent}
      </div>
      <div class="brand">${cap.marque}</div>
      <div class="variant">${cap.variante}</div>
      <div class="details">🏭 ${cap.brasserie}</div>
      <div class="details">📍 ${cap.pays} | 📅 ${cap.annee}</div>
      ${badgeHtml}
      ${photo ? `<button class="remove-photo" data-key="${key}">Supprimer la photo</button>` : ''}
    `;
    grid.appendChild(card);
  });
}

function filterAndSortCapsules(){
  const searchTerm = searchInput.value.toLowerCase();
  const country = countryFilter.value;
  const status = statusFilter.value;
  const sortOrder = sortFilter.value;

  let filtered = capsules.filter(cap => {
    const matchesSearch =
      cap.marque.toLowerCase().includes(searchTerm) ||
      cap.brasserie.toLowerCase().includes(searchTerm) ||
      cap.variante.toLowerCase().includes(searchTerm);
    const matchesCountry = country === 'all' || cap.pays === country;
    const matchesStatus = status === 'all' || cap.statut === status;
    return matchesSearch && matchesCountry && matchesStatus;
  });

  filtered.sort((a,b) => {
    if(sortOrder === 'az') return a.marque.localeCompare(b.marque);
    if(sortOrder === 'za') return b.marque.localeCompare(a.marque);
    if(sortOrder === 'pays') return a.pays.localeCompare(b.pays) || a.marque.localeCompare(b.marque);
    return 0;
  });

  statsLine.textContent = `${filtered.length} capsule${filtered.length>1?'s':''} affichée${filtered.length>1?'s':''} sur ${capsules.length} au total`;
  renderCapsules(filtered);
}

// Clic sur une capsule -> ouvre l'appareil photo / sélecteur de fichier
grid.addEventListener('click', function(e){
  const removeBtn = e.target.closest('.remove-photo');
  if(removeBtn){
    removePhoto(removeBtn.dataset.key);
    filterAndSortCapsules();
    return;
  }
  const circle = e.target.closest('.cap-circle');
  if(circle){
    currentEditKey = circle.dataset.key;
    photoInput.click();
  }
});

photoInput.addEventListener('change', function(){
  const file = this.files[0];
  this.value = '';
  if(!file || !currentEditKey) return;
  resizeImage(file, 400, function(dataUrl){
    savePhoto(currentEditKey, dataUrl);
    filterAndSortCapsules();
  });
});

searchInput.addEventListener('input', filterAndSortCapsules);
countryFilter.addEventListener('change', filterAndSortCapsules);
statusFilter.addEventListener('change', filterAndSortCapsules);
sortFilter.addEventListener('change', filterAndSortCapsules);

filterAndSortCapsules();
</script>
